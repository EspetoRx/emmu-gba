[package]
name = "emmu-gba"
version = "0.1.0"
edition = "2024"
description = "Emmu GBA WebAssembly core"
repository = "https://github.com/EspetoRx/emmu-gba"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

# O core GBA é JavaScript (Web-GBA-Emulator). No desktop o GBA roda no Mesen,
# então este crate só tem código quando compilado para wasm32.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
